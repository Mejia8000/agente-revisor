name: Agente revisor

on:
  schedule:
    - cron: "17 9 * * *"   # 3:17 a. m. de Managua
    - cron: "17 21 * * *"  # 3:17 p. m. de Managua
  push:                    # al cambiar fuentes.json o el código, corre enseguida
    branches: [main]
    paths: ["fuentes.json", "revisor.py", ".github/workflows/revisor.yml"]
  workflow_dispatch:
    inputs:
      revisar_ahora:
        description: "Opcional: dueño/repositorio o dirección web para revisar ya"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: revisor
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Revisar con Gemini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MIS_PROYECTOS: ${{ secrets.MIS_PROYECTOS }}
          REVISAR_AHORA: ${{ inputs.revisar_ahora }}
        run: python3 -u revisor.py 2>&1 | tee ultima-corrida.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Guardar informes
        if: always()
        run: |
          git config user.name "agente-revisor"
          git config user.email "agente-revisor@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Informes $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep 10; done
          exit 1
